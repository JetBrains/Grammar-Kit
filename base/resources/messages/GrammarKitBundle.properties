settings.grammar.kit.cli.contract=The command runs once, from the project base directory, over the whole selection.\n\
  The grammar paths replace a standalone `$GrammarFiles$` argument, or are appended if there is none.\n\
  The command is not run through a shell; double-quote arguments containing spaces.\n\
  `$PROJECT_DIR$` and other path macros are expanded.\n\
  To refresh only the produced files, print a `grammar-kit:generated <path>` line for each of them.

